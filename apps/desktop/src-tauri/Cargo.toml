[package]
name = "mind-desktop"
version = "0.1.0"
description = "MindSpace - 去中心化创想空间"
edition = "2021"

[lib]
name = "mind_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
